<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MAISON VELA — Una casa de belleza privada para cabello, uñas y piel.">
<title>MAISON VELA — Cabello, Uñas y Piel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-logo" id="navLogo"></div>
  <div class="nav-links" id="navLinks">
    <a href="#services" id="navServices"></a>
    <a href="#ritual" id="navExperience"></a>
    <a href="#gallery" id="navGallery"></a>
    <a href="#visit" id="navVisit"></a>
  </div>
  <div class="nav-actions">
    <a href="#" class="nav-cta" id="navCta"></a>
    <button class="nav-burger" id="navBurger" aria-label="Abrir menú" aria-expanded="false" aria-controls="navLinks">
      <span></span>
      <span></span>
    </button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <span class="eyebrow hero-eyebrow" id="heroEyebrow"></span>
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="hero-actions">
      <a href="#" class="btn btn-primary" id="heroCta"></a>
      <a href="#services" class="btn btn-ghost" id="heroSecondary"></a>
    </div>
  </div>
  <div class="hero-scroll"><div class="hero-scroll-line"></div><span id="heroScroll"></span></div>
</section>

<!-- SERVICES -->
<section class="section" id="services">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" id="servicesEyebrow"></span>
      <h2 class="section-title" id="servicesTitle"></h2>
    </div>
  </div>
  <div class="services-grid" id="servicesGrid"></div>
</section>

<!-- RITUAL STRIP (signature) -->
<section class="ritual" id="ritual">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" id="ritualEyebrow"></span>
      <h2 class="section-title" style="color:var(--ivory)" id="ritualTitle"></h2>
    </div>
  </div>
  <div class="ritual-track" id="ritualTrack"></div>
</section>

<!-- GALLERY -->
<section class="section" id="gallery">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" id="galleryEyebrow"></span>
      <h2 class="section-title" id="galleryTitle"></h2>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section class="section section-dark">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" id="testimonialsEyebrow"></span>
      <h2 class="section-title" style="color:var(--ivory)" id="testimonialsTitle"></h2>
    </div>
    <div class="testi-track" id="testiTrack"></div>
  </div>
</section>

<!-- LOCATION -->
<section class="section" id="visit">
  <div class="container">
    <div class="location-grid">
      <div class="reveal left">
        <span class="eyebrow" style="color:var(--rose-ember)" id="visitEyebrow"></span>
        <h2 class="section-title" style="margin:16px 0 30px" id="visitTitle"></h2>
        <p id="locAddress" style="margin-bottom:28px;color:#5b4f42;font-size:15px;"></p>
        <div id="hoursList"></div>
      </div>
      <div class="location-map reveal right">
        <img id="visitImage" src="https://images.unsplash.com/photo-1521931961826-fe48677230a5?q=80&w=900&auto=format&fit=crop" alt="Interior del salón">
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <div class="footer-cta reveal">
      <span class="eyebrow" style="color:var(--champagne)" id="footerEyebrow"></span>
      <h2 class="section-title" id="footerTitle"></h2>
      <a href="#" class="btn btn-primary" id="footerCta" style="margin-top:10px;"></a>
    </div>
    <div class="footer-bottom">
      <span id="footerBrand"></span>
      <span id="footerContact"></span>
      <a id="footerInsta" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>
</footer>

<a href="#" class="wa-float" id="waFloat" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1s-.7 1-.9 1.2c-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.3s1 2.7 1.1 2.9c.1.2 2 3 4.8 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.7 1.5 5.2L2 22l4.9-1.4c1.5.8 3.2 1.3 5.1 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.3c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.3 1 1-3.2-.2-.3C3.5 15 3 13.5 3 12c0-5 4-9 9-9s9 4 9 9-4 9-9 9.3z"/></svg>
</a>

<script src="config.js"></script>
<script>
(function () {
  const c = CONFIG;
  const u = c.ui;
  const waLink = `https://wa.me/${c.whatsappNumber}?text=${encodeURIComponent(c.whatsappDefaultMessage)}`;

  document.documentElement.lang = c.lang || 'es';
  document.title = `${c.brandName} — ${c.tagline}`;
  document.querySelector('meta[name="description"]').content = u.metaDescription;

  // ---- Apply color tokens ----
  const root = document.documentElement.style;
  Object.entries(c.colors).forEach(([k, v]) => {
    const cssVar = '--' + k.replace(/([A-Z])/g, '-$1').toLowerCase();
    root.setProperty(cssVar, v);
  });

  // ---- UI strings ----
  document.getElementById('navServices').textContent = u.navServices;
  document.getElementById('navExperience').textContent = u.navExperience;
  document.getElementById('navGallery').textContent = u.navGallery;
  document.getElementById('navVisit').textContent = u.navVisit;
  document.getElementById('navCta').textContent = u.navBook;
  document.getElementById('heroCta').textContent = u.heroCta;
  document.getElementById('heroSecondary').textContent = u.heroSecondary;
  document.getElementById('heroScroll').textContent = u.heroScroll;
  document.getElementById('servicesEyebrow').textContent = u.servicesEyebrow;
  document.getElementById('servicesTitle').textContent = u.servicesTitle;
  document.getElementById('ritualEyebrow').textContent = u.ritualEyebrow;
  document.getElementById('ritualTitle').textContent = u.ritualTitle;
  document.getElementById('galleryEyebrow').textContent = u.galleryEyebrow;
  document.getElementById('galleryTitle').textContent = u.galleryTitle;
  document.getElementById('testimonialsEyebrow').textContent = u.testimonialsEyebrow;
  document.getElementById('testimonialsTitle').textContent = u.testimonialsTitle;
  document.getElementById('visitEyebrow').textContent = u.visitEyebrow;
  document.getElementById('visitTitle').textContent = u.visitTitle;
  document.getElementById('visitImage').alt = u.visitImageAlt;
  document.getElementById('footerEyebrow').textContent = u.footerEyebrow;
  document.getElementById('footerTitle').textContent = u.footerTitle;
  document.getElementById('footerCta').textContent = u.footerCta;
  document.getElementById('waFloat').setAttribute('aria-label', u.whatsappLabel);

  // ---- Nav ----
  document.getElementById('navLogo').textContent = c.brandNameShort;
  document.getElementById('navCta').href = waLink;
  document.getElementById('navCta').target = '_blank';

  // ---- Hero ----
  document.getElementById('heroBg').style.backgroundImage = `url('${c.heroImage}')`;
  document.getElementById('heroEyebrow').textContent = c.heroEyebrow;
  const [line1, line2] = c.heroHeadlineLines;
  document.getElementById('heroTitle').innerHTML = `${line1}<br><em>${line2}</em>`;
  document.getElementById('heroSub').textContent = c.heroSub;
  document.getElementById('heroCta').href = waLink;
  document.getElementById('heroCta').target = '_blank';

  // ---- Services ----
  const servicesGrid = document.getElementById('servicesGrid');
  servicesGrid.innerHTML = c.services.map(s => `
    <div class="service-card reveal">
      <div class="service-label">${s.label}</div>
      <div class="service-name serif">${s.name}</div>
      <div class="service-desc">${s.description}</div>
      <ul class="service-list">
        ${s.items.map(i => `<li>${i}</li>`).join('')}
      </ul>
    </div>
  `).join('');

  // ---- Ritual strip ----
  const ritualTrack = document.getElementById('ritualTrack');
  ritualTrack.innerHTML = c.ritualSteps.map(r => `
    <div class="ritual-card reveal">
      <img src="${r.img}" alt="${r.title}" loading="lazy">
      <div class="ritual-meta">
        <div class="ritual-time serif">${r.time}</div>
        <div class="ritual-title">${r.title}</div>
        <div class="ritual-text">${r.text}</div>
      </div>
    </div>
  `).join('');

  // ---- Gallery ----
  const galleryGrid = document.getElementById('galleryGrid');
  galleryGrid.innerHTML = c.gallery.map((src, i) => `
    <div class="gallery-item reveal ${i % 3 === 0 ? 'tall' : ''}">
      <img src="${src}" alt="${u.galleryImageAlt} ${i + 1}" loading="lazy">
    </div>
  `).join('');

  // ---- Testimonials ----
  const testiTrack = document.getElementById('testiTrack');
  testiTrack.innerHTML = c.testimonials.map(t => `
    <div class="testi-card reveal">
      <div class="testi-quote">"${t.quote}"</div>
      <div class="testi-name">${t.name}</div>
    </div>
  `).join('');

  // ---- Location ----
  document.getElementById('locAddress').textContent = c.address;
  document.getElementById('hoursList').innerHTML = c.hours.map(h => `
    <div class="hours-row"><span>${h.day}</span><span>${h.time}</span></div>
  `).join('');

  // ---- Footer ----
  document.getElementById('footerCta').href = waLink;
  document.getElementById('footerCta').target = '_blank';
  document.getElementById('footerBrand').textContent = `${c.brandName} — ${c.tagline}`;
  document.getElementById('footerContact').textContent = `${c.phoneDisplay} · ${c.address}`;
  const insta = document.getElementById('footerInsta');
  insta.textContent = c.instagramHandle;
  insta.href = c.instagramUrl;

  // ---- WhatsApp float ----
  document.getElementById('waFloat').href = waLink;

  // ---- Mobile nav ----
  const nav = document.getElementById('nav');
  const navLinks = document.getElementById('navLinks');
  const navBurger = document.getElementById('navBurger');

  function closeNav() {
    nav.classList.remove('open');
    navBurger.setAttribute('aria-expanded', 'false');
    navBurger.setAttribute('aria-label', u.openMenu);
    document.body.classList.remove('nav-open');
  }

  navBurger.addEventListener('click', () => {
    const isOpen = nav.classList.toggle('open');
    navBurger.setAttribute('aria-expanded', String(isOpen));
    navBurger.setAttribute('aria-label', isOpen ? u.closeMenu : u.openMenu);
    document.body.classList.toggle('nav-open', isOpen);
  });

  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', closeNav);
  });

  // ---- Nav scroll state ----
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive: true });

  // ---- Hero parallax (JS-driven, works on mobile Safari) ----
  const heroBg = document.getElementById('heroBg');
  let ticking = false;
  function updateParallax() {
    const y = window.scrollY;
    if (y < window.innerHeight * 1.2) {
      heroBg.style.transform = `translateY(${y * 0.35}px) scale(1.05)`;
    }
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(updateParallax);
      ticking = true;
    }
  }, { passive: true });

  // ---- Scroll reveal ----
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

  document.querySelectorAll('.reveal').forEach((el, i) => {
    el.style.transitionDelay = `${(i % 6) * 70}ms`;
    observer.observe(el);
  });
})();
</script>
</body>
</html>
